version: 2
project_name: drone-openartifact

before:
  hooks:
    - go mod tidy

builds:
  - id: plugin
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: SHA256SUMS

# SBOM per archive (syft is installed by the release workflow).
sboms:
  - artifacts: archive

# Keyless signature of the checksum file; verify with
#   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/openartifact/drone-openartifact/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: false

changelog:
  use: github
  groups:
    - title: Breaking changes
      regexp: ^.*?\w+(\(.+\))??!:.+$
      order: 0
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 1
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 2
    - title: Others
      order: 999
